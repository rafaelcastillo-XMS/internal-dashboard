# NOT used in production. Dokploy builds from the Dockerfile and runs the app as a
# Swarm service, ignoring this file — the volumes below never apply there. In prod the
# credential files are File Mounts configured in the Dokploy panel (app → Advanced →
# Volumes), stored in /etc/dokploy/applications/<app>/files/ and mounted to /app/<file>.
# This compose file is for local/self-hosted runs only.
services:
  dashboard:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Google OAuth credentials — keep on VPS host, never bake into the image
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      # GBP-only token (xperiencemarketingsolutions@gmail.com) — file must exist
      # on the host before compose up (echo '{}' > token-gbp.json)
      - ./token-gbp.json:/app/token-gbp.json
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
